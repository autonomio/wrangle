name: Dependency security

on:
  push:
    branches: [master]
    paths: [pyproject.toml, 'requirements*.txt', .github/workflows/dependency-audit.yml]
  pull_request:
    paths: [pyproject.toml, 'requirements*.txt', .github/workflows/dependency-audit.yml]
  schedule:
    - cron: '41 14 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -c requirements-ci.txt 'pip-audit>=2.9,<3'
      - run: python -m pip_audit -r requirements-audit.txt -r requirements-ci.txt
