name: Dependency security

on:
  push:
    branches: [master]
    paths: [pyproject.toml, 'requirements*', scripts/lock_dependencies.py, .github/workflows/dependency-audit.yml]
  pull_request:
    paths: [pyproject.toml, 'requirements*', scripts/lock_dependencies.py, .github/workflows/dependency-audit.yml]
  schedule:
    - cron: '41 14 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-ci.txt -r requirements-audit.txt
      - run: python scripts/lock_dependencies.py --check
      - run: python -m pip check
      - run: python -m pip_audit --require-hashes -r requirements-audit.txt -r requirements-ci.txt
