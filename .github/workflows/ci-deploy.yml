name: Verified release artifacts

on:
  release:
    types: [published]

permissions:
  contents: read

# Build, signing and PyPI publication have separate credentials.
# Only the publication job receives the existing PyPI API-token secret.
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: "946684800"
      PYTHONHASHSEED: "0"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-ci.txt -r requirements-audit.txt
      - run: python -m pip install --no-deps --no-build-isolation -e '.[dev,excel]'
      - run: python -m pip check
      - run: python scripts/lock_dependencies.py --check
      - run: python -m pytest -W error
      - run: python -m ruff check wrangle scripts
      - run: python -m bandit -c pyproject.toml -r wrangle scripts/check_release.py -q
      - run: python -m pip_audit --require-hashes -r requirements-audit.txt -r requirements-ci.txt
      - run: python scripts/build_catalog.py --check
      - run: python -m build --no-isolation
      - run: python scripts/check_reproducible_build.py
      - run: python scripts/verify_distribution.py
      - run: python -m twine check --strict dist/*
      - run: python scripts/check_release.py --require-tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 90
  attest-and-attach:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist
      - name: Verify the transferred wheel and source archive against their checksums
        run: sha256sum --check SHA256SUMS
        working-directory: dist
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: attest
        with:
          subject-path: dist/*
          create-storage-record: false
      - name: Verify trusted repository, workflow, commit and SLSA provenance
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_REF: ${{ github.ref }}
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          for artifact in dist/*.whl dist/*.tar.gz dist/SHA256SUMS; do
            gh attestation verify "$artifact" --bundle "$ATTESTATION_BUNDLE" \
              --repo "$GH_REPO" --signer-workflow "$GH_REPO/.github/workflows/ci-deploy.yml" \
              --signer-digest "$RELEASE_COMMIT" --source-digest "$RELEASE_COMMIT" --source-ref "$RELEASE_REF" \
              --predicate-type https://slsa.dev/provenance/v1 \
              --cert-oidc-issuer https://token.actions.githubusercontent.com --deny-self-hosted-runners
          done
      - name: Export the verified signed in-toto provenance
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          jq -ce '.dsseEnvelope | select(.payloadType == "application/vnd.in-toto+json" and (.signatures | length) > 0)' \
            "$ATTESTATION_BUNDLE" > dist/provenance.intoto.jsonl
      - name: Attach immutable distributions, checksums and the attestation bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$ATTESTATION_BUNDLE" dist/attestation.json
          gh release upload "$RELEASE_TAG" dist/* --repo "$GH_REPO"
  publish-pypi:
    needs: attest-and-attach
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: release
      url: https://pypi.org/project/wrangle/
    permissions:
      contents: read
    steps:
      - name: Require the configured PyPI publication token
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$PYPI_API_TOKEN" ]; then
            echo '::error::PYPI_API_TOKEN must be available to Wrangle from organization secrets.'
            exit 1
          fi
      - name: Retrieve the signed release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" --dir verified \
            --pattern '*.whl' --pattern '*.tar.gz' --pattern SHA256SUMS --pattern attestation.json
      - name: Verify checksums, signatures and the exact release identity before upload
        working-directory: verified
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          wheels=(*.whl)
          archives=(*.tar.gz)
          test "${#wheels[@]}" -eq 1
          test "${#archives[@]}" -eq 1
          sha256sum --check SHA256SUMS
          for artifact in "${wheels[@]}" "${archives[@]}" SHA256SUMS; do
            gh attestation verify "$artifact" --bundle attestation.json \
              --repo "$GH_REPO" --signer-workflow "$GH_REPO/.github/workflows/ci-deploy.yml" \
              --signer-digest "$RELEASE_COMMIT" --source-digest "$RELEASE_COMMIT" --source-ref "$RELEASE_REF" \
              --predicate-type https://slsa.dev/provenance/v1 \
              --cert-oidc-issuer https://token.actions.githubusercontent.com --deny-self-hosted-runners
          done
          mkdir ../packages
          cp "${wheels[@]}" "${archives[@]}" ../packages/
      - name: Publish the verified distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: packages/
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: false
