name: Research data contracts

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # Standalone Polars examples print Unicode tables on every runner.
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.13']
        polars: ['latest']
        yaml: ['latest']
        include:
          - os: ubuntu-latest
            python: '3.10'
            polars: '1.34.0'
            yaml: '0.18.6'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -c requirements-ci.txt '.[dev,excel]'
      - if: matrix.polars != 'latest'
        run: python -m pip install polars==${{ matrix.polars }}
      - if: matrix.yaml != 'latest'
        run: python -m pip install ruamel.yaml==${{ matrix.yaml }}
      - run: python -m pytest -W error
      - run: python scripts/build_catalog.py --check
      - run: python examples/research_batch.py
      - run: python examples/preparation_workflows.py
      - run: python examples/frozen_parameters.py
      - run: python examples/inspection_workflow.py
      - run: python examples/expression_workflow.py
      - run: python examples/disk_preparation.py
      - run: python examples/human_workflow.py
      - run: python examples/start_workflow.py
      - run: python -m wrangle catalog unpivot
      - run: python -m build --no-isolation
      - run: python -m twine check --strict dist/*
      - run: python scripts/verify_distribution.py
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -c requirements-ci.txt '.[dev,excel]'
      - run: python -m ruff check wrangle scripts
      - run: python -m bandit -c pyproject.toml -r wrangle scripts/check_release.py -q
      - run: python -m pip_audit -r requirements-audit.txt -r requirements-ci.txt
      - run: python scripts/check_reproducible_build.py
      - run: python -m pytest -W error --cov=wrangle --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: statement-coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14
