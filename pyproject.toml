[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wrangle"
version = "1.0.0"
description = "Native Polars data preparation for scientific researchers and agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Mikko Kotila", email = "mailme@mikkokotila.com" }]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = ["polars>=1.44.2,<2", "ruamel.yaml>=0.18.6,<0.20", "tzdata>=2024.1"]

[project.scripts]
wrangle = "wrangle._cli:main"

[project.optional-dependencies]
excel = ["fastexcel>=0.12,<1"]
dev = [
    "pytest>=8", "pytest-cov>=6,<8", "build", "hatchling", "twine>=7,<8",
    "ruff>=0.11,<1", "bandit[toml]>=1.8,<2", "pip-audit>=2.9,<3",
    "tomli>=2.2; python_version < '3.11'",
]

[project.urls]
Repository = "https://github.com/autonomio/wrangle"

[tool.hatch.build.targets.wheel]
packages = ["wrangle"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "wrangle/AGENTS.md"

[tool.hatch.build.targets.sdist]
include = ["/wrangle", "/tests", "/examples", "/scripts", "/README.md", "/AGENTS.md", "/LICENSE", "/pyproject.toml", "/requirements*.txt", "/.github", "/SECURITY.md", "/CONTRIBUTING.md", "/GOVERNANCE.md", "/CODE_OF_CONDUCT.md", "/ROADMAP.md", "/CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["dist", "build"]

[tool.ruff.lint]
# Correctness plus practical PEP 8 structure; scientific expressions may use
# assigned lambdas and conventional short mathematical names.
select = ["F", "E4", "E7", "E9"]
ignore = ["E731", "E741"]

[tool.ruff.lint.per-file-ignores]
# Namespace files deliberately export these imports.
"wrangle/**/__init__.py" = ["F401"]
# Engine definitions precede imports to preserve operation registration.
"wrangle/_api.py" = ["E402"]
"wrangle/df/_expressions.py" = ["E402"]
# The checkout path is added before importing the package for the catalog build.
"scripts/build_catalog.py" = ["E402"]

[tool.bandit]
# Executable documentation is verification code, not the runtime engine.
exclude_dirs = ["wrangle/docs", "tests", "examples"]

[tool.coverage.run]
source = ["wrangle"]
omit = ["wrangle/docs/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
precision = 2
