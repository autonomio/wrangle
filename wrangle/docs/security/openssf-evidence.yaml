interpretation:
  purpose: Human-reviewed answer draft, not a submitted certification or a claim that any badge has
    been achieved.
  status_scope: Status evaluates currently available public evidence or explicitly unresolved
    history. Unpublished files cannot promote a criterion to Met.
  candidate_scope: after_publication.candidate_status is a review proposal, not a result. Complete
    required checks, publish evidence and obtain required human confirmations before promotion.
  path_base: Checkout root. Paths beginning wrangle/docs/ refer to documents shipped in the
    installed package.
  local_documents: Some referenced documents/workflows are being added in this change. Verify their
    existence and contents; their mention is not evidence of completion.
  submission_values:
  - Met
  - Unmet
  - N/A
  - '?'
  passing_rule: Meet every MUST; meet each SHOULD or give an acceptable unmet justification;
    consider every SUGGESTED.
  silver_rule: Achieve Passing and meet the additional Silver criteria. Do not substitute
    documentation for actual coverage, release signatures or continuity access.
  na_rule: Use N/A only where official criteria allow it and the applicability argument is verified.
  legal_policy: This draft does not adopt a DCO, impose retroactive sign-off, assert contributor
    legal authority or make a new maintainer commitment.
  assessment_windows: Recompute rolling report/vulnerability/bug-fix windows at submission time.
    Confirm private records with the maintainer.
priority_blockers:
- id: publish_current_evidence
  action: Publish the reviewed modernization, docs, tests and CI; replace draft URLs with a stable
    public revision.
- id: register_project
  action: Registered as project 15135; questionnaire answers remain drafts until submitted.
  state: complete
- id: confirm_continuity_person_and_consent
  action: The owner confirms EnergyGuy3 can take over issues, merges and releases within one week.
    GitHub administrator access is verified; publish the governance statement. No rehearsal is
    claimed.
  state: owner_confirmed_admin_access_verified
- id: primary_developer_secure_design_confirmation
  action: Owner identifies EnergyGuy3 as the backup maintainer with secure-development expertise;
    publish the role and retain the owner-affirmed basis.
  state: owner_confirmed
- id: confirm_vulnerability_history_and_current_findings
  action: Review public advisories and private maintainer records, including response times, credits
    and credential incidents.
- id: record_coverage_result_at_least_80_percent
  action: Publish measured statement coverage >=80% and enforce the threshold against the production
    package.
- id: record_clean_static_analysis_runs
  action: Run and review Bandit/CodeQL/Ruff findings; publish successful CI evidence.
- id: verify_bit_for_bit_generated_catalog_and_build_repetition
  action: Verify repeated generated catalogs and builds with controlled timestamps and dependencies.
- id: publish_actual_signed_release
  action: Publish a real signed release, then independently verify the wheel/sdist and document
    trust roots and identity checks.
